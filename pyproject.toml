[project]
name = "seafseaf"
version = "0.8.0"
description = "Helldivers 2 Loadout Randomizer for Discord"
authors = [
    { name = "James Murphy", email = "james.frank.murphy@proton.me" }
]
requires-python = ">=3.14"
dependencies = [
    "discord-py>=2.7.1",
    "more-itertools>=11.1.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
